name: Mindustry v159.3 compatibility

on:
  push:
    branches:
      - fix/mindustry-v159.3
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build Plague for Mindustry v159.3
        run: ./gradlew --no-daemon clean :plague-core:jar

      - name: Smoke test Plague on Mindustry v159.3
        run: bash scripts/smoke-test-v159.3.sh

      - name: Build production image
        id: image
        run: |
          mkdir -p prod/image-input
          cp plague-core/build/libs/plague-core-0.0.20.jar prod/image-input/plague-core.jar
          image="plague-server:v159.3-${GITHUB_SHA::12}"
          echo "tag=$image" >> "$GITHUB_OUTPUT"
          docker build \
            --file prod/Dockerfiles/mindustry.Dockerfile \
            --tag "$image" \
            .

      - name: Smoke test production image
        run: bash scripts/smoke-test-image-v159.3.sh "${{ steps.image.outputs.tag }}"

      - name: Export production image and checksum
        run: |
          archive="${RUNNER_TEMP}/plague-server-v159.3-${GITHUB_SHA::12}.tar.zst"
          docker save "${{ steps.image.outputs.tag }}" | zstd --threads=0 --no-progress -19 -o "$archive"
          sha256sum "$archive" >"$archive.sha256"
          cat "$archive.sha256"

      - name: Upload image smoke-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plague-image-smoke-log-v159.3
          path: ${{ runner.temp }}/plague-image-smoke.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload production image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plague-server-image-v159.3
          path: |
            ${{ runner.temp }}/plague-server-v159.3-*.tar.zst
            ${{ runner.temp }}/plague-server-v159.3-*.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload smoke-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plague-smoke-log-v159.3
          path: ${{ runner.temp }}/plague-smoke/server.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Plague JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plague-core-v159.3
          path: plague-core/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
