name: Mindustry v159.3 compatibility

on:
  push:
    branches:
      - fix/mindustry-v159.3
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build Plague for Mindustry v159.3
        run: ./gradlew --no-daemon clean :plague-core:jar

      - name: Upload Plague JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: plague-core-v159.3
          path: plague-core/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
